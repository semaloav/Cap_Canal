name: Publicar Cap_Canal en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --include=dev --include=optional --no-audit --no-fund
      - name: Verificar cálculos y guardado
        run: |
          node tests/hydraulics.test.mjs
          node tests/project.test.mjs
          node tests/barriers.test.mjs
          node tests/gvf.test.mjs
          node tests/flume.test.mjs
          node tests/section-mesh.test.mjs
          node tests/gvf-ui.test.mjs
          node tests/guest-projects.test.mjs
      - name: Verificar tipos
        run: npx tsc --noEmit
      - name: Compilar aplicación sin servidor
        run: npm run build:pages
      - name: Validar publicación estática
        run: node tests/pages-build.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
